name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── 1. LINT ────────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Backend lint
        run: cd server && npm ci && npm run lint

      - name: Frontend lint
        run: cd client && npm ci && npm run lint

  # ── 2. BACKEND TESTS ───────────────────────────────────────────────────────
  test-backend:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: cd server && npm ci

      - name: Generate Prisma client
        run: cd server && npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopflow_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/shopflow_test

      - name: Run Prisma migrations
        run: cd server && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopflow_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/shopflow_test

      - name: Verify database connection
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d shopflow_test \
            -c "SELECT COUNT(*) AS table_count FROM information_schema.tables WHERE table_schema='public';"

      - name: Run tests
        run: cd server && npm run test:ci
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopflow_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/shopflow_test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'github_actions_test_jwt_secret_must_be_at_least_64_characters_long_placeholder' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'github_actions_test_jwt_refresh_secret_must_be_at_least_64_characters_long_placeholder' }}
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          PORT: '5000'
          CLIENT_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          RESEND_API_KEY: re_placeholder
          EMAIL_FROM: test@test.com
          CLOUDINARY_CLOUD_NAME: placeholder
          CLOUDINARY_API_KEY: '000000000000000'
          CLOUDINARY_API_SECRET: placeholder
          GOOGLE_CLIENT_ID: placeholder.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: placeholder

  # ── 3. FRONTEND TESTS ──────────────────────────────────────────────────────
  test-frontend:
    name: 🧪 Frontend Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: cd client && npm ci

      - name: Run tests
        run: cd client && npm run test:coverage
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder.apps.googleusercontent.com

  # ── 4. SECURITY AUDIT ─────────────────────────────────────────────────────
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend audit
        run: cd server && npm ci && npm audit --audit-level=high

      - name: Frontend audit
        run: cd client && npm ci && npm audit --audit-level=high
        continue-on-error: true   # next.js dev deps may have moderate advisories

  # ── 5. BUILD ──────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, security]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Build backend
        run: cd server && npm ci && npm run build

      - name: Build frontend
        run: cd client && npm ci && npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_SITE_URL: https://shopflow-theta.vercel.app

  # ── 6. DEPLOY NOTIFICATION ────────────────────────────────────────────────
  # Both frontend and backend auto-deploy via Vercel GitHub integration.
  # This job just logs the URLs after a successful main branch push.
  notify:
    name: 🚀 Deploy Notification
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Print deployment URLs
        run: |
          echo "✅ CI passed — Vercel will auto-deploy:"
          echo "  Frontend: https://shopflow-theta.vercel.app"
          echo "  Backend:  https://api-shopflow.vercel.app"
